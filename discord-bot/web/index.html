<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sahara Cartel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="stage">
      <div class="parallax"><div class="kb"><img class="hero-img" src="/img/sahara.jpg" alt="Sahara Cartel: trei oameni mascați în fața conacului, la apus"></div></div>
      <div class="hero-clouds" aria-hidden="true"></div>
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-sweep" aria-hidden="true"></div>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="hero-fade"></div>
      <div class="hero-curtain" aria-hidden="true"></div>
    </div>
    <h1 class="sr">Sahara Cartel</h1>
    <div id="me" class="me"></div>
    <nav id="nav" class="nav" aria-label="Secțiuni"></nav>
  </header>
  <main id="view" class="page" aria-live="polite"></main>
  <aside id="drawer" class="drawer" hidden aria-label="Profil"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="lantern" aria-hidden="true"></div>
  <div id="weed" aria-hidden="true"><div class="hop"><svg class="spin" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#8a6a3a" stroke-linecap="round"><circle cx="32" cy="32" r="26" stroke-width="2" stroke-dasharray="46 9 20 7"/><circle cx="32" cy="32" r="19" stroke-width="1.8" stroke-dasharray="30 8 24 6"/><circle cx="32" cy="32" r="12" stroke-width="1.6" stroke-dasharray="18 6 14 5"/><path d="M8 36C22 18 40 46 57 26M12 22C28 34 38 14 54 40M20 54C26 36 40 30 46 8M6 30C20 28 30 40 40 58" stroke-width="1.5"/><path d="M14 46C24 40 44 44 52 30" stroke="#a9834a" stroke-width="1.3"/></svg></div></div>
  <noscript><p class="notice">Pagina are nevoie de JavaScript.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
