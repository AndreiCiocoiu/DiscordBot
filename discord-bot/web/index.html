<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100805">
  <meta name="description" content="Panoul Sahara Cartel — clasament, membri, crafting și administrare.">
  <title>Sahara Cartel</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/hub.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="stage">
      <div class="parallax"><img class="hero-back" src="/img/sahara.jpg" alt=""></div>
      <img class="hero-art" src="/img/sahara.jpg" width="1200" height="675" alt="Sahara Cartel: trei oameni mascați în fața conacului, la apus">
      <div class="hero-glow" aria-hidden="true"></div>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="hero-fade"></div>
      <div class="hero-curtain" aria-hidden="true"></div>
    </div>
    <h1 class="sr">Sahara Cartel</h1>
    <div id="me" class="me"></div>
    <button id="quick-open" class="quick-open" type="button" hidden aria-keyshortcuts="Control+k Meta+k" title="Caută peste tot (Ctrl+K)">
      <span class="quick-symbol" aria-hidden="true">⌕</span> Caută <kbd>Ctrl K</kbd>
    </button>
    <nav id="nav" class="nav" aria-label="Secțiuni"></nav>
  </header>
  <section id="family-summary" class="family-summary" aria-label="Rezumatul săptămânii" hidden></section>
  <main id="view" class="page" aria-live="polite"></main>
  <aside id="drawer" class="drawer" hidden aria-label="Profil"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="lantern" aria-hidden="true"></div>
  <div id="command-palette" class="command-palette" hidden role="dialog" aria-modal="true" aria-label="Căutare rapidă">
    <button id="command-backdrop" class="command-backdrop" type="button" aria-label="Închide căutarea"></button>
    <section class="command-panel" aria-labelledby="command-title">
      <div class="command-top"><span id="command-title">Căutare rapidă</span><button id="command-close" type="button" aria-label="Închide">×</button></div>
      <input id="command-input" type="search" placeholder="Caută membri sau secțiuni…" autocomplete="off" aria-label="Caută membri și secțiuni">
      <div id="command-results" class="command-results" role="listbox" aria-label="Rezultate"></div>
      <footer class="command-foot">↑ ↓ navigare <span>Enter deschide · Esc închide</span></footer>
    </section>
  </div>
  <noscript><p class="notice">Pagina are nevoie de JavaScript.</p></noscript>
  <script src="/hub.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
