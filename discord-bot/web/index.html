<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sahara Cartel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <img class="hero-img" src="/img/sahara.jpg" alt="Sahara Cartel: trei oameni mascați în fața conacului, la apus">
    <div class="hero-fade"></div>
    <h1 class="sr">Sahara Cartel</h1>
    <div id="me" class="me"></div>
    <nav id="nav" class="nav" aria-label="Secțiuni"></nav>
  </header>
  <main id="view" class="page" aria-live="polite"></main>
  <aside id="drawer" class="drawer" hidden aria-label="Profil"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="notice">Pagina are nevoie de JavaScript.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
