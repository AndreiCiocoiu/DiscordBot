<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0a17">
  <meta name="description" content="Reduceri la jocuri de pe Steam și alte magazine, jocuri gratis și anunțuri, într-un singur loc.">
  <title>{{NAME}}: reduceri la jocuri</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"><i></i><i></i></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <a class="skip" href="#view">Sari la conținut</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="{{NAME}}, prima pagină"><span class="brand-tag" aria-hidden="true">%</span><span class="brand-name">{{NAME}}</span></a>
    <nav id="nav" class="nav" aria-label="Secțiuni"></nav>
    <div class="tools">
      <button id="find" class="tool" type="button" aria-label="Caută un joc"></button>
      <select id="cur" class="cur" aria-label="Moneda afișată"></select>
      <div id="me" class="me"></div>
    </div>
  </header>
  <main id="view" class="page" tabindex="-1"></main>
  <footer class="foot">
    <p class="foot-community"><a href="#/comunitate">Comunitatea Persona Non Grata · Clasamente, evenimente și turnee</a></p>
    <p>Prețurile vin de la <a href="https://www.cheapshark.com" target="_blank" rel="noopener">CheapShark</a> și sunt în dolari; în alte monede sunt aproximative. Jocurile gratuite vin din Epic Games Store. Prețul final îl vezi în magazin.</p>
  </footer>
  <nav id="tabbar" class="tabbar" aria-label="Secțiuni"></nav>
  <aside id="sheet" class="sheet" hidden aria-label="Detalii joc"></aside>
  <div id="palette" class="palette" hidden></div>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="notice">Pagina are nevoie de JavaScript.</p></noscript>
  <script src="/hub.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
